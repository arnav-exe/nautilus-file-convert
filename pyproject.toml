[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nautilus-file-convert"
version = "0.1.0"
description = "Fast Nautilus context-menu file conversion for Ubuntu GNOME."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "nautilus-file-convert contributors" },
]

[project.scripts]
nautilus-file-convert = "nautilus_file_convert.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nautilus_file_convert = ["presets/*.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
